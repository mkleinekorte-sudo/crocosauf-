name: Arbeitsstunden Android APK
on:
  push:
    branches: [build-arbeitsstunden-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: APK bauen
        working-directory: arbeitsstunden-android
        run: gradle --no-daemon :app:assembleDebug
      - name: APK prüfen und benennen
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose arbeitsstunden-android/app/build/outputs/apk/debug/app-debug.apk
          cp arbeitsstunden-android/app/build/outputs/apk/debug/app-debug.apk Arbeitsstunden-Marcel-Christian.apk
          sha256sum Arbeitsstunden-Marcel-Christian.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Arbeitsstunden-Marcel-Christian-APK
          path: Arbeitsstunden-Marcel-Christian.apk
          if-no-files-found: error
